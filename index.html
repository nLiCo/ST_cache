<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ST_cache — 캠퍼스 숨은 장소 찾기</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <span id="title">ST_cache</span>
    <nav id="menu">
      <a href="#explore">탐색</a>
      <a href="#upload">등록</a>
    </nav>
    <span id="progress">찾은 장소 0 / 0</span>
    <span id="account"></span>
  </header>

  <div id="map"></div>

  <nav id="strip" aria-label="찾을 장소 사진"></nav>

  <aside id="debug" class="collapsed" hidden>
    <button id="debug-toggle" type="button">디버그</button>
    <div id="debug-body"></div>
  </aside>

  <section id="card" hidden>
    <button id="card-close" type="button" aria-label="닫기">×</button>
    <div id="card-content"></div>
  </section>

  <section id="upload" hidden>
    <div id="upload-gate"></div>
    <form id="upload-form" novalidate hidden>
      <h2>장소 올리기</h2>
      <p class="help">올리고 싶은 자리에 서서 사진을 찍어 주세요. 사진 찍기 버튼을 누르는 순간의 위치가 장소 위치가 돼요.</p>
      <div id="upload-accuracy"></div>
      <div id="upload-wait" class="warn" hidden>이 자리에 서서 잠시 기다려 주세요</div>
      <button type="button" id="upload-camera" class="primary">📷 사진 찍기</button>
      <input type="file" id="upload-file" accept="image/*" capture="environment" hidden>
      <div id="upload-photo" hidden>
        <img id="upload-preview" alt="찍은 사진">
        <div id="upload-pinned"></div>
      </div>
      <label>이름 (필수)
        <input id="upload-name" type="text" maxlength="30" autocomplete="off">
        <span class="count" data-for="upload-name" data-max="30"></span>
      </label>
      <label>힌트 (선택)
        <input id="upload-hint" type="text" maxlength="100" autocomplete="off">
        <span class="count" data-for="upload-hint" data-max="100"></span>
      </label>
      <label>이야기 (선택, 찾은 사람에게만 보여요)
        <textarea id="upload-story" rows="4" maxlength="500"></textarea>
        <span class="count" data-for="upload-story" data-max="500"></span>
      </label>
      <div id="upload-error" role="alert"></div>
      <button type="submit" id="upload-submit" class="primary">등록하기</button>
    </form>
  </section>

  <dialog id="nickname-dialog">
    <form id="nickname-form">
      <h2>닉네임 정하기</h2>
      <p>다른 사람에게는 이 닉네임만 보여요. 장소 카드와 랭킹에 나옵니다.</p>
      <input id="nickname-input" type="text" minlength="2" maxlength="12"
             placeholder="2~12자" autocomplete="off" required>
      <div id="nickname-error"></div>
      <div class="actions">
        <button type="button" id="nickname-cancel">나중에</button>
        <button type="submit">정하기</button>
      </div>
    </form>
  </dialog>

  <div id="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
